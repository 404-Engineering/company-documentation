# nginx site for 404 Engineering. setup.sh replaces __DOMAIN__ and installs this
# as /etc/nginx/sites-available/404engineering; certbot then adds the HTTPS block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/404engineering;
    index index.html;

    # Fittingly, our own 404 page.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
}
